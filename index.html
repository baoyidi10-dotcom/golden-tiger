<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Tiger">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Golden Tiger · Presença</title>
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{
  --bg:#070707; --panel:#141310; --line:#2c2819; --line2:#3d3517;
  --text:#f6f0df; --muted:#a79f88; --gold:#f2b705; --gold2:#ffd54a; --gold3:#b8860b;
  --accent-ink:#1a1300; --ok:#43c08f; --bad:#e8604c;
  --goldgrad:linear-gradient(135deg,#ffd54a 0%,#f2b705 45%,#c8921a 100%);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 460px at 50% -140px,#2c2108 0%,#0b0a07 55%,#070707 100%) no-repeat,#070707;padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}

/* ambient layers */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wm{position:fixed;left:50%;top:55%;width:140vw;max-width:880px;aspect-ratio:1/1;transform:translate(-50%,-50%);background:center/contain no-repeat;opacity:.04;z-index:0;pointer-events:none}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 42%,rgba(0,0,0,.78) 100%)}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 16px}

/* type */
.display{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","sans-serif-condensed","Helvetica Neue",Impact,"PingFang SC",sans-serif;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.foil{background:linear-gradient(100deg,#c8921a 0%,#ffe27a 22%,#f2b705 40%,#fff4c9 50%,#f2b705 60%,#b8860b 80%,#ffd54a 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 5s ease-in-out infinite alternate}
@keyframes foil{from{background-position:0% 50%}to{background-position:100% 50%}}

/* header */
header.top{padding:calc(16px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{perspective:600px;flex:none;cursor:pointer}
.brand .logo img{display:block;width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px #0b0a07,0 0 0 3px var(--gold3);animation:glow 3.2s ease-in-out infinite;transition:transform .9s var(--ease)}
.brand .logo img.flip{transform:rotateY(360deg)}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #0b0a07,0 0 0 3px var(--gold3),0 0 14px rgba(242,183,5,.18)}50%{box-shadow:0 0 0 2px #0b0a07,0 0 0 3px var(--gold),0 0 28px rgba(242,183,5,.45)}}
header.top h1{margin:0;font-size:23px;line-height:1.05}
header.top .tag{color:var(--gold);font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;margin-top:4px;font-weight:700}
header.top .sub{color:var(--muted);font-size:12px;text-align:right}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin:4px 0 14px;display:flex;gap:14px;align-items:center;border:1.5px solid transparent;
  background:linear-gradient(135deg,#1f1907,#120f08 60%,#0c0b08) padding-box,conic-gradient(from var(--ang),#3a3216 0deg,#ffd54a 40deg,#3a3216 95deg,#3a3216 180deg,#f2b705 220deg,#3a3216 275deg,#3a3216 360deg) border-box;
  animation:spin 7s linear infinite;box-shadow:0 18px 40px rgba(0,0,0,.45)}
@keyframes spin{to{--ang:360deg}}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(260px 160px at 100% 0,rgba(242,183,5,.16),transparent 70%);pointer-events:none}
.hero .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,226,122,.09) 45%,transparent 60%);transform:translateX(-100%);animation:sweep 6s 1.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-100%)}35%,100%{transform:translateX(100%)}}
.hero .hday{font-size:11.5px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:800;position:relative}
.hero .big{font-size:29px;line-height:1.05;margin:5px 0 12px;position:relative}
.hero .nums{display:flex;gap:22px;position:relative}
.hero .nums b{display:block;font-size:28px;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.hero .nums span{font-size:10.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.ring{--p:0;position:relative;width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(#ffd54a 0%,#f2b705 calc(var(--p)*1%),#2a2414 calc(var(--p)*1%));transition:--p 1.1s var(--ease);box-shadow:0 0 30px rgba(242,183,5,.18)}
.ring .rin{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1d180a,#0b0a07);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #3d3517}
.ring b{font-size:23px;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* generic */
.banner{background:#2a2108;border:1px solid #5d4a12;color:#f3d489;border-radius:14px;padding:10px 12px;margin:2px 0 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.err{background:#32140f;border-color:#7a2e25;color:#f3a89d}
h2{font-size:12px;margin:22px 0 10px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:2.2px;display:flex;align-items:center;gap:10px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{position:relative;background:linear-gradient(180deg,rgba(26,23,16,.92),rgba(16,15,11,.92));border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card.click{cursor:pointer;overflow:hidden;transition:border-color .2s,transform .15s}
.card.click:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{position:relative;overflow:hidden;border:1px solid var(--line2);background:rgba(19,18,14,.9);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;transition:all .2s}
.chip.on{background:var(--goldgrad);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 18px rgba(242,183,5,.35)}
.btn{position:relative;overflow:hidden;border:1px solid var(--line2);background:rgba(27,25,19,.95);color:var(--text);padding:11px 16px;border-radius:13px;font-size:15px;cursor:pointer;font-weight:600;transition:transform .12s}
.btn.primary{background:var(--goldgrad);border-color:transparent;color:var(--accent-ink);font-weight:800;box-shadow:0 6px 22px rgba(242,183,5,.32)}
.btn.primary:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:btnshine 4.8s 1.4s ease-in-out infinite;pointer-events:none}
@keyframes btnshine{0%{left:-60%}28%,100%{left:130%}}
.btn.danger{background:#2e130f;border-color:#7a2e25;color:#f3a89d}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.96)}
input,select,textarea{width:100%;background:#100f0b;border:1px solid var(--line2);color:var(--text);border-radius:13px;padding:12px 13px;font-size:16px;font-family:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,183,5,.16)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold);vertical-align:middle;margin:0 8px 0 0;flex:none}
textarea{min-height:110px;resize:vertical}
label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}
label.inline{text-transform:none;letter-spacing:0;font-size:15px;color:var(--text);font-weight:500;display:flex;align-items:center}

/* avatar + progress ring */
.avr{--p:0;padding:3px;border-radius:50%;flex:none;background:conic-gradient(#ffd54a 0%,#f2b705 calc(var(--p)*1%),#2a2414 calc(var(--p)*1%));transition:--p 1.1s var(--ease)}
.avr.full{background:conic-gradient(#7fe0bc 0%,#43c08f calc(var(--p)*1%),#2a2414 calc(var(--p)*1%));box-shadow:0 0 16px rgba(67,192,143,.45)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--gold2);background:radial-gradient(circle at 30% 25%,#2d2610,#121009);letter-spacing:.5px}
.avr.big .av{width:92px;height:92px;font-size:32px}
.avr.big{padding:5px;margin:0 auto;display:inline-block}

/* belts */
.beltbar{display:inline-block;width:66px;height:12px;border-radius:3px;background:var(--c);position:relative;box-shadow:0 0 0 1px #6b5a26,0 1px 4px rgba(0,0,0,.6);vertical-align:middle;overflow:hidden}
.beltbar .tip{position:absolute;right:6px;top:0;bottom:0;width:22px;background:#0b0b0b;box-shadow:0 0 0 1px rgba(107,90,38,.55);display:flex;gap:2px;align-items:center;justify-content:center}
.beltbar.black .tip{background:#c0271d}
.beltbar .tip i{width:2.5px;height:100%;background:#fff}
.beltchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}

.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:#102c22;color:#7fe0bc}.pill.soon{background:#33290b;color:#f6d77c}.pill.na{background:#1d1b15;color:var(--muted)}
.pill.bad{background:#3a1712;color:#f6aa9d;animation:pulseb 2.4s ease-in-out infinite}
@keyframes pulseb{0%,100%{box-shadow:0 0 0 0 rgba(232,96,76,0)}50%{box-shadow:0 0 0 5px rgba(232,96,76,.16)}}

/* attendance rows */
.item{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:11px 14px;background:linear-gradient(180deg,rgba(26,23,16,.92),rgba(16,15,11,.92));border:1px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;transition:border-color .25s,background .25s}
.item.on{border-color:var(--gold3);background:linear-gradient(180deg,rgba(36,29,10,.95),rgba(22,18,9,.95))}
.item:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--goldgrad);transform:scaleY(0);transition:transform .3s var(--ease)}
.item.on:before{transform:scaleY(1)}
.item.flash{animation:flash .8s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(242,183,5,.55),inset 0 0 50px rgba(242,183,5,.25)}100%{box-shadow:0 0 0 14px rgba(242,183,5,0),inset 0 0 0 rgba(242,183,5,0)}}
.tog{position:relative;overflow:hidden;width:48px;height:48px;border-radius:50%;border:2px solid #3a3320;background:#100f0b;display:flex;align-items:center;justify-content:center;flex:none;color:transparent;transition:background .25s,border-color .25s,box-shadow .25s}
.tog svg{width:24px;height:24px}
.tog.on{background:var(--goldgrad);border-color:transparent;color:#1a1300;box-shadow:0 4px 18px rgba(242,183,5,.5)}
.tog.just svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.3) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

.bar{height:9px;background:#1d1a12;border-radius:999px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--goldgrad);border-radius:999px;transform-origin:left;transition:transform 1.1s var(--ease)}
.bar.full>i{background:linear-gradient(90deg,#43c08f,#7fe0bc)}
.ready{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#06241a;background:linear-gradient(90deg,#43c08f,#9ff0d0,#43c08f);background-size:200% 100%;padding:2px 8px;border-radius:999px;text-transform:uppercase;animation:foil 2.4s linear infinite alternate;vertical-align:middle}
.stat{display:flex;gap:12px;margin:4px 0 6px}
.stat>div{flex:1;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(32,26,9,.95),rgba(18,17,13,.95));border:1px solid var(--line2);border-radius:18px;padding:13px 15px}
.stat b{display:block;font-size:27px;color:var(--gold2);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,9,7,.9);border-top:1px solid var(--line2);display:flex;justify-content:center;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav.tabs .in{max-width:560px;width:100%;display:flex;gap:2px}
nav.tabs button{flex:1;background:none;border:0;color:#7d765f;padding:8px 2px 4px;font-size:10.5px;border-radius:12px;position:relative;cursor:pointer;font-weight:700;letter-spacing:.3px;transition:color .2s}
nav.tabs button svg{display:block;margin:0 auto 3px;width:24px;height:24px;transition:transform .25s var(--ease)}
nav.tabs button.on{color:var(--gold)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.08);filter:drop-shadow(0 0 6px rgba(242,183,5,.55))}
nav.tabs button.on:before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--goldgrad);box-shadow:0 0 12px var(--gold)}
nav.tabs .badge{position:absolute;top:2px;right:24%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:800;box-shadow:0 0 10px rgba(232,96,76,.6)}

/* modal, toast, celebration */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#modal.on{display:flex;animation:fade .25s}
#modal.on .sheet{animation:up .4s var(--ease)}
#modal .sheet{background:linear-gradient(180deg,#16130c,#0b0a07);border:1px solid var(--line2);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#modal .sheet:before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:#3d3517;margin:-6px auto 12px}
#modal h3{margin:0 0 4px;font-size:21px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,9,6,.96);border:1px solid var(--gold3);color:var(--text);padding:11px 16px;border-radius:14px;display:none;gap:14px;align-items:center;z-index:80;font-size:14px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 20px rgba(242,183,5,.12)}
#toast.on{display:flex;animation:tin .35s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
#toast button{background:none;border:0;color:var(--gold);font-weight:800;font-size:14px;cursor:pointer}
.cf{position:fixed;z-index:90;pointer-events:none;border-radius:1px}
#celeb{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(520px 420px at 50% 45%,rgba(64,48,8,.9),rgba(0,0,0,.92));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#celeb.on{display:flex;animation:fade .3s}
#celeb .cbox{text-align:center;max-width:340px;animation:cin .6s var(--ease)}
@keyframes cin{from{opacity:0;transform:scale(.82) translateY(14px)}to{opacity:1;transform:none}}
#celeb .oss{font-size:46px;line-height:1;margin-top:18px}
#celeb .ctext{color:var(--text);font-size:16px;margin-top:8px;line-height:1.5}
#celeb .bigbelt{margin:24px auto 22px;width:250px;height:34px;border-radius:6px;background:var(--c);position:relative;overflow:hidden;box-shadow:0 0 0 1px #6b5a26,0 12px 34px rgba(0,0,0,.7)}
#celeb .bigbelt .tip{position:absolute;right:22px;top:0;bottom:0;width:80px;background:#0b0b0b;display:flex;gap:7px;align-items:center;justify-content:center}
#celeb .bigbelt.black .tip{background:#c0271d}
#celeb .bigbelt .tip i{width:8px;height:100%;background:#fff}
#celeb .bigbelt .tip i.new{animation:stripe .7s .5s var(--ease) both}
#celeb .bigbelt.newbelt{animation:beltin .8s .25s var(--ease) both}
#celeb .bigbelt:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:btnshine 2.6s 1s ease-in-out infinite}
@keyframes stripe{0%{transform:scaleY(0);opacity:0}70%{transform:scaleY(1.2);opacity:1}100%{transform:scaleY(1);opacity:1}}
@keyframes beltin{from{transform:scaleX(.15);opacity:0}to{transform:none;opacity:1}}

/* intro */
.intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px;background:radial-gradient(620px 520px at 50% 45%,#241b06,#070707 70%);transition:opacity .5s var(--ease)}
.intro img{width:160px;height:160px;border-radius:50%;opacity:0;animation:crestin 1s var(--ease) forwards;filter:drop-shadow(0 0 34px rgba(242,183,5,.5))}
.intro .t1{margin-top:24px;font-size:24px;letter-spacing:.32em;opacity:0;animation:fin .6s .55s forwards}
.intro .t2{margin-top:10px;font-size:10px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;opacity:0;animation:fin .6s .85s forwards}
.intro.out{opacity:0;pointer-events:none}
@keyframes crestin{0%{transform:rotateY(-100deg) scale(.7);opacity:0}55%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes fin{to{opacity:1}}

/* view enter */
.view .ani{animation:vin .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rip{position:absolute;border-radius:50%;background:rgba(255,213,74,.32);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* welcome + misc */
.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1px dashed var(--line2);border-radius:18px;margin-top:10px}
.welcome{text-align:center;padding:14px 6px 4px}
.halo{width:222px;height:222px;margin:6px auto 0;border-radius:50%;padding:5px;background:conic-gradient(from var(--ang),transparent 0deg,#f2b705 50deg,transparent 120deg,transparent 180deg,#ffd54a 230deg,transparent 300deg);animation:spin 4.5s linear infinite;box-shadow:0 0 60px rgba(242,183,5,.18)}
.halo img{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 3px #0b0a07}
.welcome h3{margin:22px 0 8px;font-size:26px}
.welcome p{margin:0 auto 18px;max-width:320px;color:var(--muted);font-size:14.5px}
.datebar{display:flex;gap:8px;align-items:center}
.datebar input{flex:1;text-align:center;font-weight:700}
.weeks{display:flex;gap:6px;flex-wrap:wrap}
.wday{min-width:44px;text-align:center;padding:9px 0;border-radius:11px;border:1px solid var(--line2);background:#13120e;font-size:13px;cursor:pointer;font-weight:700}
.wday.on{background:var(--goldgrad);border-color:transparent;color:var(--accent-ink)}
.small{font-size:12px;color:var(--muted)}
@media (min-width:700px){#app{padding-top:10px}.hero .big{font-size:33px}}

/* calm mode: no motion, no particles */
body.calm #fx,body.calm .grain{display:none}
body.calm *,body.calm *:before,body.calm *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

/* ---------- date helpers (local time, no UTC drift) ---------- */
function p2(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function addMonths(s,n){
  var d=parse(s),day=d.getDate();
  d.setDate(1);d.setMonth(d.getMonth()+n);
  var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,last));return iso(d);
}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/86400000);}
function fmt(s){if(!s)return '';var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0];}
function fmtShort(s){var a=s.split('-');return a[2]+'/'+a[1];}
var WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var DAYN=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function prettyDate(d){var x=parse(d);return DAYN[x.getDay()]+', '+x.getDate()+' '+MON[x.getMonth()];}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return S.settings.currency+(Math.round(n*100)/100);}

var BELT_COLOR={Branca:'#f2f2f2',Azul:'#2f6fe0',Roxa:'#7b3fc4',Marrom:'#7a4a24',Preta:'#16181c',Cinza:'#9a9a9a',Amarela:'#f0c929',Laranja:'#f08a24',Verde:'#2fa84f'};

function blank(){
  return {v:1,
    settings:{academy:'Golden Tiger',currency:'¥',perStripe:30,remindDays:3,staleDays:14,calm:false},
    classes:[
      {id:uid(),name:'Adulto',days:[1,3,5],time:'19:00',group:'adulto'},
      {id:uid(),name:'Infantil',days:[2,4],time:'17:30',group:'infantil'}
    ],
    students:[],att:{},payments:[],
    meta:{lastBackup:null,created:today()}};
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);if(d&&d.v===1)return d;}
  }catch(e){memOnly=true;}
  return blank();
}
function save(){
  if(memOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memOnly=true;}
}
S=load();

/* ---------- derived ---------- */
function findStudent(id){for(var i=0;i<S.students.length;i++)if(S.students[i].id===id)return S.students[i];return null;}
function findClass(id){for(var i=0;i<S.classes.length;i++)if(S.classes[i].id===id)return S.classes[i];return null;}
function firstName(s){return (s.name||'').trim().split(/\s+/)[0]||'';}
function initials(n){var p=(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'').toUpperCase()+((p.length>1?p[p.length-1][0]:'')||'').toUpperCase();}
function attended(s){
  var out=[];
  for(var d in S.att){for(var c in S.att[d]){if(S.att[d][c].indexOf(s.id)>-1)out.push({date:d,classId:c});}}
  return out;
}
function classesSince(s){
  var from=s.beltSince||s.joined||'0000-00-00',n=0;
  attended(s).forEach(function(a){if(a.date>=from)n++;});
  return n;
}
function lastSeen(s){var m=null;attended(s).forEach(function(a){if(!m||a.date>m)m=a.date;});return m;}
function isStale(s){
  if(!s.active)return false;
  var ls=lastSeen(s),ref=ls||s.joined||today();
  return diffDays(today(),ref)>S.settings.staleDays;
}
function status(s){
  if(s.trial)return {code:'na',label:'Experimental',days:0};
  if(!s.fee)return {code:'na',label:'Sem mensalidade',days:0};
  var late=diffDays(today(),s.due);
  if(late>0)return {code:'bad',label:'Atrasado '+late+' d',days:late};
  if(late===0)return {code:'soon',label:'Vence hoje',days:0};
  if(-late<=S.settings.remindDays)return {code:'soon',label:'Vence em '+(-late)+' d',days:late};
  return {code:'ok',label:'Em dia até '+fmtShort(s.due),days:late};
}
function nextStep(s){
  var list=BELTS[s.group]||BELTS.adulto;
  if((s.stripes||0)<4)return {belt:s.belt,stripes:(s.stripes||0)+1};
  var i=list.indexOf(s.belt);
  if(i>-1&&i<list.length-1)return {belt:list[i+1],stripes:0};
  return null;
}
function nextLabel(s){var n=nextStep(s);if(!n)return 'Nível máximo da lista';return n.belt===s.belt?(n.stripes+'º grau'):('Faixa '+n.belt);}
function progPct(s){if(!nextStep(s)||s.trial)return 0;return Math.min(100,Math.round(classesSince(s)*100/(S.settings.perStripe||30)));}
function beltHtml(s){
  var col=BELT_COLOR[s.belt]||'#888',st='';
  for(var i=0;i<(s.stripes||0);i++)st+='<i></i>';
  return '<span class="beltchip"><span class="beltbar'+(s.belt==='Preta'?' black':'')+'" style="--c:'+col+'"><span class="tip">'+st+'</span></span>'+esc(s.belt)+(s.stripes?' · '+s.stripes+'º grau':'')+'</span>';
}

/* ---------- effects ---------- */
var RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function CALM(){return !!(S&&S.settings&&S.settings.calm)||!!(RM&&RM.matches);}
function haptic(p){try{if(!CALM()&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function confetti(cols,n){
  if(CALM())return;
  cols=cols||['#f2b705','#ffd54a','#fff4c9','#c8921a','#ffffff'];n=n||46;
  for(var i=0;i<n;i++){
    var c=document.createElement('div');c.className='cf';
    var w=5+Math.random()*6,h=Math.random()<.5?w:w*2.2;
    c.style.cssText='left:'+(8+Math.random()*84)+'vw;top:-16px;width:'+w+'px;height:'+h+'px;background:'+cols[i%cols.length];
    document.body.appendChild(c);
    var dx=(Math.random()-.5)*280,dur=1500+Math.random()*1200;
    if(c.animate){
      var a=c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(innerHeight+60)+'px) rotate('+Math.round(Math.random()*900)+'deg)',opacity:.85}],{duration:dur,easing:'cubic-bezier(.2,.6,.4,1)',delay:Math.random()*220});
      a.onfinish=(function(el){return function(){el.remove();};})(c);
    }else c.remove();
  }
}
function burst(el,cols){
  if(CALM()||!el||!el.getBoundingClientRect)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;cols=cols||['#f2b705','#ffd54a','#fff4c9'];
  for(var i=0;i<20;i++){
    var c=document.createElement('div');c.className='cf';var sz=4+Math.random()*5;
    c.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+cols[i%cols.length];
    document.body.appendChild(c);
    var ang=Math.random()*Math.PI*2,dist=50+Math.random()*90;
    if(c.animate){
      var a=c.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate('+Math.round(Math.cos(ang)*dist)+'px,'+Math.round(Math.sin(ang)*dist+40)+'px) scale(.3)',opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.15,.7,.3,1)'});
      a.onfinish=(function(e2){return function(){e2.remove();};})(c);
    }else c.remove();
  }
}
function initFx(){
  var cv=document.getElementById('fx');if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d'),dpr=1,pts=[];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  size();window.addEventListener('resize',size);
  var N=innerWidth<700?34:54;
  for(var i=0;i<N;i++)pts.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,vx:(Math.random()-.5)*.00006,vy:-.00003-Math.random()*.00011,a:.2+Math.random()*.45,ph:Math.random()*6,big:Math.random()<.14,g:196+Math.floor(Math.random()*40)});
  var last=0;
  function tick(t){
    if(CALM()||document.hidden){ctx.clearRect(0,0,cv.width,cv.height);setTimeout(function(){requestAnimationFrame(tick);},700);return;}
    requestAnimationFrame(tick);
    if(t-last<33)return;last=t;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];p.x+=p.vx*33;p.y+=p.vy*33;p.ph+=.025;
      if(p.y<-.03){p.y=1.03;p.x=Math.random();}if(p.x<-.03)p.x=1.03;if(p.x>1.03)p.x=-.03;
      var al=p.a*(.55+.45*Math.sin(p.ph)),X=p.x*cv.width,Y=p.y*cv.height;
      if(p.big){ctx.beginPath();ctx.arc(X,Y,p.r*5*dpr,0,7);ctx.fillStyle='rgba(242,183,5,'+(al*.13)+')';ctx.fill();}
      ctx.beginPath();ctx.arc(X,Y,p.r*dpr,0,7);ctx.fillStyle='rgba(255,'+p.g+',70,'+al+')';ctx.fill();
    }
  }
  requestAnimationFrame(tick);
}

  document.body.appendChild(d);

  d.addEventListener('click',gone);setTimeout(gone,1750);

function countUp(el){
  var to=+el.getAttribute('data-count'),pre=el.getAttribute('data-pre')||'',suf=el.getAttribute('data-suf')||'';
  if(CALM()||!to)return;
  var t0=null,d=750;
  function f(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=pre+Math.round(to*e)+suf;if(p<1)requestAnimationFrame(f);}
  el.textContent=pre+'0'+suf;requestAnimationFrame(f);
  setTimeout(function(){el.textContent=pre+to+suf;},d+200);
}

function viewPagamentos(){
  var act=S.students.filter(function(s){return s.active&&!s.trial&&s.fee;});
  var late=act.filter(function(s){return status(s).code==='bad';}).sort(function(a,b){return status(b).days-status(a).days;});
  var soon=act.filter(function(s){return status(s).code==='soon';}).sort(function(a,b){return a.due<b.due?-1:1;});
  var ok=act.filter(function(s){return status(s).code==='ok';}).sort(function(a,b){return a.due<b.due?-1:1;});
  var lateSum=late.reduce(function(t,s){return t+s.fee;},0);
  var month=today().slice(0,7),received=S.payments.filter(function(p){return p.date.slice(0,7)===month;}).reduce(function(t,p){return t+p.amount;},0);
  var cur=esc(S.settings.currency);
  var h='<div class="stat ani" '+A(0)+'><div><b data-count="'+late.length+'">'+late.length+'</b><span>em atraso ('+money(lateSum)+')</span></div><div><b data-count="'+Math.round(received)+'" data-pre="'+cur+'">'+money(received)+'</b><span>recebido neste mês</span></div></div>';
  var k=1;

    var st=status(s);
    return '<div class="card ani" '+A(k++)+'><div class="row">'+avatar(s)+'<div class="grow"><div class="name">'+esc(s.name)+'</div><div class="meta">'+money(s.fee)+' · vencimento '+fmt(s.due)+'</div></div><span class="pill '+st.code+'">'+esc(st.label)+'</span></div>'

  }
  if(!act.length)return h+'<div class="empty">Nenhum aluno com mensalidade. Defina o valor no cadastro do aluno.</div>';
  if(late.length){h+='<h2>Em atraso</h2>'+late.map(row).join('');}

  if(ok.length){h+='<h2>Em dia ('+ok.length+')</h2>'+ok.map(row).join('');}
  return h;

function saveStudent(){
  var g=function(id){return document.getElementById(id);};
  var name=g('f-name').value.trim();
  if(!name){toast('Digite o nome');g('f-name').focus();return;}
  var id=g('f-id').value,isNew=!id,s=isNew?{id:uid(),history:[],active:true}:findStudent(id);
  if(!s)return;
  var oldBelt=s.belt,oldStripes=s.stripes;
  s.name=name;s.contact=g('f-contact').value.trim();s.group=g('f-group').value;
  s.belt=g('f-belt').value;if((BELTS[s.group]||[]).indexOf(s.belt)<0)s.belt='Branca';
  s.stripes=+g('f-stripes').value;s.joined=g('f-joined').value||today();
  s.fee=g('f-fee').value===''?0:Math.max(0,+g('f-fee').value);
  s.trial=g('f-trial').checked;s.notes=g('f-notes').value.trim();
  if(!isNew)s.active=g('f-active').checked;
  var dueIn=g('f-due').value;
  if(isNew){
    s.beltSince=s.joined;
    s.history=[{date:s.joined,belt:s.belt,stripes:s.stripes}];
    s.due=dueIn||(g('f-paid')&&g('f-paid').checked?addMonths(s.joined,1):s.joined);

    if(dueIn)s.due=dueIn;else if(!s.due)s.due=s.joined;
    if(s.belt!==oldBelt||s.stripes!==oldStripes){s.beltSince=today();s.history=(s.history||[]).concat([{date:today(),belt:s.belt,stripes:s.stripes}]);}
  }

function toggle(el,id){

  var day=(S.att[ui.date]=S.att[ui.date]||{}),arr=(day[cur.id]=day[cur.id]||[]),i=arr.indexOf(id),nowOn=i<0;
  if(i>-1)arr.splice(i,1);else arr.push(id);

  save();

  var s=findStudent(id),avr=el.querySelector('.avr');
  if(s&&avr){var pp=progPct(s);avr.style.setProperty('--p',pp);avr.classList.toggle('full',pp>=100);}
  var n=patchHero();
  if(nowOn&&n.total>1&&n.present===n.total){confetti();toast('Turma completa! Oss! 🥋');}
}

  var d=blank();d.settings.academy='Golden Tiger';d.settings.perStripe=20;

  var names=[['Rafael Souza','adulto','Azul',2,300,-10,-80],['Camila Lima','adulto','Branca',3,300,6,-60],['Bruno Alves','adulto','Roxa',1,350,-3,-300],['João Pereira','adulto','Branca',0,300,12,-14],['Marcos Silva','adulto','Marrom',0,350,1,-500],['Ana Costa','adulto','Branca',1,300,-20,-90],['Diego Santos','adulto','Azul',0,300,18,-120],['Lucas Oliveira','infantil','Cinza',1,200,4,-70],['Pedro Gomes','infantil','Branca',2,200,-5,-45],['Sofia Rocha','infantil','Amarela',0,200,22,-100],['Miguel Ferreira','infantil','Branca',4,200,2,-30],['Laura Martins','infantil','Cinza',0,200,15,-60]];
  var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
  names.forEach(function(n,i){
    var joined=addDays(t,n[6]);
    var s={id:'demo'+i,name:n[0],contact:'',group:n[1],belt:n[2],stripes:n[3],joined:joined,fee:n[4],trial:false,active:true,notes:'',beltSince:addDays(t,Math.max(n[6],-70)),due:addDays(t,n[5]),history:[{date:joined,belt:n[2],stripes:n[3]}]};
    d.students.push(s);
    var stop=(i===3||i===9)?-25:0;
    for(var k=Math.max(n[6],-60);k<=-1;k++){
      if(k>stop)continue;
      var day=addDays(t,k),c=(s.group==='infantil')?cK:cA,wd=parse(day).getDay();
      if(c.days.indexOf(wd)<0)continue;
      if(rnd()<(i<2?0.93:0.72)){(d.att[day]=d.att[day]||{});(d.att[day][c.id]=d.att[day][c.id]||[]).push(s.id);}
    }
    d.payments.push({id:'dp'+i,studentId:s.id,date:addDays(t,-10-i),amount:n[4],months:1});
  });
  d.meta.lastBackup=t;
  return d;
}

    case 'close':closeModal();break;

  }

  ok(addMonths('2026-01-31',1)==='2026-02-28','addMonths clamps Jan 31 to Feb 28');
  ok(addMonths('2026-12-15',1)==='2027-01-15','addMonths crosses year');
  ok(diffDays('2026-03-30','2026-03-29')===1,'diffDays across a date');
  S=blank();
  var cl=S.classes[0];
  ok(S.students.length===0,'starts empty');
  var s={id:'t1',name:'Teste Um',contact:'',group:'adulto',belt:'Branca',stripes:0,joined:addDays(today(),-40),fee:300,trial:false,active:true,notes:'',beltSince:addDays(today(),-40),due:addDays(today(),-5),history:[]};
  S.students.push(s);
  ok(status(s).code==='bad'&&status(s).days===5,'overdue 5 days detected');
  s.due=addDays(today(),2);ok(status(s).code==='soon','due soon detected');
  s.due=addDays(today(),20);ok(status(s).code==='ok','paid up detected');
  s.due=addDays(today(),-5);ui.date=today();
  var d0=today();(S.att[d0]=S.att[d0]||{})[cl.id]=['t1'];
  ok(classesSince(s)===1,'attendance counted since belt date');
  ok(lastSeen(s)===d0,'last seen is today');
  var base=(s.due>=d0)?s.due:d0;s.due=addMonths(base,1);ok(s.due===addMonths(d0,1),'late payment restarts the cycle from the payment date');
  s.due=addDays(today(),10);var b2=(s.due>=d0)?s.due:d0;ok(addMonths(b2,1)===addMonths(addDays(today(),10),1),'early payment keeps the cycle');
  var n=nextStep(s);ok(n&&n.stripes===1&&n.belt==='Branca','first promotion is 1st stripe');
  s.stripes=4;var n2=nextStep(s);ok(n2&&n2.belt==='Azul'&&n2.stripes===0,'4 stripes then next belt');
  s.belt='Preta';s.stripes=4;ok(nextStep(s)===null,'black belt with 4 stripes has no next step in list');
  s.belt='Branca';s.stripes=0;S.att={};s.joined=addDays(today(),-30);ok(isStale(s),'never attended for 30 days is stale');
  var back=JSON.parse(JSON.stringify(S));ok(validData(back),'backup JSON validates');
  ok(!validData({v:2}),'rejects wrong backup');
  var dm=demoData();S=dm;ok(dm.students.length===12,'demo has 12 students');
  ok(S.students.some(function(x){return status(x).code==='bad';}),'demo has overdue students');
  ok(S.students.some(isStale),'demo has students who disappeared');
  ok(S.students.some(function(x){return classesSince(x)>=S.settings.perStripe;}),'demo has a student ready to promote');
  ['hoje','alunos','pagamentos','graduacao','ajustes'].forEach(function(t){
    try{ui.tab=t;render();ok(app.innerHTML.length>200,'renders tab '+t);}catch(e){ok(false,'renders tab '+t+': '+e.message);}
  });
  try{studentForm(null);ok(sheet.innerHTML.indexOf('Novo aluno')>-1,'student form opens');closeModal();}catch(e){ok(false,'student form: '+e.message);}
  try{classForm(S.classes[0]);closeModal();payForm(S.students[0]);closeModal();ok(true,'class and payment forms open');}catch(e){ok(false,'forms: '+e.message);}
  // ---- real click-through flows ----
  try{
    S=blank();save();ui.tab='alunos';ui.q='';ui.filter='todos';ui.classId=null;animTab=null;render();
    document.querySelector('[data-act="new-student"]').click();
    ok(!!document.getElementById('f-name'),'click: new-student opens the form');
    document.getElementById('f-name').value='Aluno Teste';document.getElementById('f-fee').value='300';
    sheet.querySelector('[data-act="save-student"]').click();
    ok(S.students.length===1&&S.students[0].name==='Aluno Teste'&&S.students[0].due===today(),'click: save student (due today when first month not paid)');
    ui.tab='hoje';ui.date=today();render();
    var cls0=classesOn(today())[0]||S.classes[0];ui.classId=cls0.id;S.students[0].group=cls0.group==='infantil'?'infantil':'adulto';render();
    document.querySelector('.item').click();
    var rec=S.att[today()]&&S.att[today()][cls0.id];
    ok(rec&&rec.length===1,'click: tap student marks present');
    ok(document.querySelector('.item').classList.contains('on')&&document.getElementById('h-present').textContent==='1','click: row and counter update in place');
    document.querySelector('.item').click();
    ok(!S.att[today()]&&document.getElementById('h-present').textContent==='0','click: tap again removes the mark');
    S.students[0].due=addDays(today(),-3);ui.tab='pagamentos';render();
    document.querySelector('[data-act="pay"]').click();
    ok(!!document.getElementById('p-amt'),'click: pay form opens');
    sheet.querySelector('[data-act="save-pay"]').click();
    ok(S.students[0].due===addMonths(today(),1)&&S.payments.length===1,'click: payment saved, next due is +1 month from payment date');
    toastEl.querySelector('[data-act="undo"]').click();
    ok(S.payments.length===0&&S.students[0].due===addDays(today(),-3),'click: undo restores payment');
    ui.tab='graduacao';render();
    document.querySelector('[data-act="promote"]').click();
    ok(S.students[0].stripes===1,'click: promote adds a stripe');
    ok(celebEl.className==='on'&&celebEl.innerHTML.indexOf('Oss!')>-1,'click: promotion shows the celebration');
    toastEl.querySelector('[data-act="undo"]').click();
    ok(S.students[0].stripes===0&&celebEl.className==='','click: undo restores promotion and closes celebration');
    ok(importData(JSON.stringify(S))===true,'backup text restores');
    S.settings.calm=true;render();ok(document.body.classList.contains('calm'),'effects switch turns on calm mode');
    S.settings.calm=false;render();ok(!document.body.classList.contains('calm'),'effects switch turns effects back on');
    ui.tab='ajustes';render();document.querySelector('[data-act="wipe"]').click();
    sheet.querySelector('[data-act="do-wipe"]').click();
    ok(S.students.length===0,'click: wipe asks for confirmation then clears');
  }catch(e){ok(false,'click-through crashed: '+e.message);}
  var pre=document.createElement('pre');pre.id='selftest';pre.textContent=out.join('\n')+'\n'+(fail?'SELFTEST FAIL '+fail:'SELFTEST PASS');
  pre.style.cssText='position:fixed;top:0;left:0;right:0;background:#000;color:#9f9;font:12px monospace;padding:8px;z-index:999;white-space:pre-wrap';
  document.body.appendChild(pre);document.title=fail?'SELFTEST FAIL':'SELFTEST PASS';
  try{localStorage.removeItem(KEY);}catch(e){}
}

/* ---------- start ---------- */
if(LOGO){document.getElementById('wm').style.backgroundImage='url('+LOGO+')';}
if(!TEST&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
if(TEST){selfTest();}
else{
  if(DEMOM){S=demoData();ui.tab=DEMOM[1]||'hoje';}
  initFx();intro();render();
}
})();
</script>
